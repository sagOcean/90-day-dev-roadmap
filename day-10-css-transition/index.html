<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A work on CSS transition</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <div class="projects">

        
        <div class="button-wrapper">
            <!-- A button that scales up and darkens on hover, using a 150–200ms ease-out transition. -->
          <button class="button">Please click me</button>
        </div>
    
        <div class="card">
            <!-- Cards that lift on hover (translateY plus shadow). -->
            <p>this is a card</p>
        </div>

    </div>
  </body>
</html>
