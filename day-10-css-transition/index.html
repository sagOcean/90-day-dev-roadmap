<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A work on CSS transition</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="projects">
      <div class="button-wrapper">
        <!-- A button that scales up and darkens on hover, using a 150–200ms ease-out transition. -->
        <button class="button">Please click me</button>
      </div>

      <div class="card">
        <!-- Cards that lift on hover (translateY plus shadow). -->
        <p>this is a card</p>
      </div>

      <div class="navbar">
        <div class="logo">
          <img src="image.png" alt="dropbox logo" />
          <h1>dropbox</h1>
        </div>
        <div class="nav-items">
          <div><span>contact sales</span></div>
          <div><span>signup</span></div>
          <div><span>login</span></div>
          <button>get started</button>
        </div>
      </div>
    </div>
  </body>
</html>
