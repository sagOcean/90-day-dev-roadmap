<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>css grid practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2 class="price-listing">Price listing</h2>
  <main class="main-container">


    <section class="category basic">
      <h2 class="price-category">Basic</h2>
      <h3 class="additional-description">for teams and developers</h3>


      <div class="price">

        <p class="dollar">$0</p>
        <p>/month</p>

      </div>
      <button class="button-to-join">Join for free</button>

    </section>

    <section class="category pro">
      <h2 class="price-category">Pro</h2>
      <h3 class="additional-description">Advanced collaboration and support for teams</h3>


      <div class="price">

        <p class="dollar">$2</p>
        <p>/user/month</p>

      </div>
      <button class="button-to-join">Continue with team</button>

    </section>

    <section class="category premium">
      <h2 class="price-category">Premium</h2>
      <h3 class="additional-description">Security and flexible deployment</h3>


      <div class="price">

        <p class="dollar">$40</p>
        <p>/user/month</p>

      </div>
      <button class="button-to-join">Contact sales</button>

    </section>
    
    
  </main>
</body>
</html>
