<!DOCTYPE html>
<html lang="en">
<head>

    <title>reflowing dashboard grid</title>
    <link rel="stylesheet" href="style2-dashboard.css">

</head>
<body>
    <div class="main-container">
        <div class="sub-container">

        <div class="sub-container">
